<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — Eichler Market</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/em-favicon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:#0e1118;color:#e8e3d8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.icon{margin-bottom:20px}
h1{font-size:32px;font-weight:500;color:#fff;margin-bottom:14px}
p{font-size:15px;color:rgba(232,227,216,.65);max-width:440px;line-height:1.7;font-weight:300}
.badge{display:inline-block;background:rgba(200,169,110,0.08);border:1px solid rgba(200,169,110,0.25);color:#c8a96e;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:24px;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="icon">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c8a96e" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
</div>
<span class="badge">Eichler Market</span>
<h1>Welcome to Eichler Market</h1>
<p>Create your free account to browse every Eichler in Silicon Valley, submit offers on any home — listed or not — and set your own Make Me Move price to claim a $10,000 credit toward your next deal.</p>
<script>
(function() {
  // Preserve campaign attribution (utm-style ref for mailer/marketing tracking only — not user referral credit)
  var path = window.location.pathname;
  var parts = path.split('/').filter(Boolean);
  var code = parts[parts.length - 1];
  if (!code || code === 'r') code = new URLSearchParams(window.location.search).get('code') || '';
  if (code && code !== 'r') {
    try { localStorage.setItem('em_campaign_ref', code); } catch(e){}
  }
  setTimeout(function(){ window.location.href = '/auth/?tab=signup'; }, 1400);
})();
</script>
<script src="/assets/cm-track.js" defer></script>
</body>
</html>
